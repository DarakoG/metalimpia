name: Build, test, and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid concurrent deploys; cancel in-progress deploys on new pushes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Phase 9 — Build + cross-browser Playwright matrix in a
  # single job, with a hard `needs:` chain into the deploy
  # job so any cross-origin regression OR any cross-browser
  # regression blocks the deploy.
  #
  # Merged build+test because `vite preview` (Playwright's
  # webServer) needs the built artifact in dist/ BEFORE the
  # tests run. Earlier separated "test" then "build" flow
  # left dist/ missing in the test job and timed out waiting
  # for the server.
  build-and-test:
    # Phase 9 widened the matrix to Chromium + Firefox + WebKit.
    # Ubuntu is the canonical Playwright runner; the Linux
    # system packages the browsers need are installed by
    # `playwright install --with-deps`.
    runs-on: ubuntu-latest
    # Phase 9: the cross-browser matrix takes longer than the
    # 6-minute GitHub Actions default (Phase 8 was Chromium-
    # only and finished in ~2 min). The matrix with WebKit's
    # slow JavaScriptCore WASM path and the viewport + zoom
    # + context-isolation + CPU-throttle specs pushes wall-
    # clock time to ~30-40 min on the slowest run. 60 min
    # gives headroom without being wasteful.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install Playwright browsers
        # `--with-deps` adds the Linux system packages the
        # browsers need (libnss3, libatk-bridge2.0, etc).
        # Phase 9 expanded the matrix from Chromium-only to
        # Chromium + Firefox + WebKit (see playwright.config.js
        # and the Implementation Plan §12 tasks 9.1-9.3). The
        # CI runners only need the three DESKTOP browser
        # binaries; the mobile projects reuse the same engines
        # with Playwright's Pixel 5 / iPhone 13 viewport
        # emulation.
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Generate the Phase 8 test fixture
        # The full-flow smoke test needs the minimal PNG with
        # the Author tEXt chunk. The script is idempotent.
        run: node scripts/generate-test-fixture.mjs

      - name: Run Playwright tests
        # Vite preview runs as the configured webServer
        # (port 4173). The matrix (Phase 9) is Chromium +
        # Firefox + WebKit desktop, plus Chromium-mobile
        # (Pixel 5) and WebKit-mobile (iPhone 13) — see
        # playwright.config.js. Tests cover: zero cross-
        # origin requests (privacy guard), full drop →
        # metadata → done flow, regression detection,
        # viewport matrix (7 widths), zoom matrix (50/100/
        # 150/200%), context isolation (private mode + multi-
        # tab), and CPU throttling (4x slowdown budget).
        run: npx playwright test

      - name: Upload build artifact for deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            tests/screenshots
          retention-days: 7

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
