name: Build, test, and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid concurrent deploys; cancel in-progress deploys on new pushes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Phase 8 — Build + Playwright Privacy Guard in a single job.
  #
  # Merged build+test because `vite preview` (Playwright's webServer)
  # needs the built artifact in dist/ BEFORE the tests run. Earlier
  # separated "test" then "build" flow left dist/ missing in the
  # test job and timed out waiting for the server.
  #
  # If any cross-origin request slips through (a privacy regression),
  # this job fails and the deploy job is skipped via `needs:`.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install Playwright Chromium
        # `--with-deps` adds the Linux system packages Chromium
        # needs (libnss3, libatk-bridge2.0, etc). Firefox / WebKit
        # are intentionally NOT installed — Phase 8 is Chromium-only.
        run: npx playwright install --with-deps chromium

      - name: Generate the Phase 8 test fixture
        # The full-flow smoke test needs the minimal PNG with the
        # Author tEXt chunk. The script is idempotent.
        run: node scripts/generate-test-fixture.mjs

      - name: Run Playwright tests
        # Vite preview runs as the configured webServer (port 4173).
        # Tests verify: zero cross-origin requests (privacy guard),
        # full drop → metadata → done flow, regression detection.
        run: npx playwright test

      - name: Upload build artifact for deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
