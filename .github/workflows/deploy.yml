name: Build, test, and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid concurrent deploys; cancel in-progress deploys on new pushes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Phase 8.6 — `test` job runs the Playwright Privacy Guard against
  # the built artifact in dist/. If any cross-origin request slips
  # through (a privacy regression), this job fails and the `deploy`
  # job is skipped via `needs: test`. The browser matrix is
  # Chromium-only (parent decision documented in
  # odd/tasks/metalimpia-mvp.md — Phase 9 manual QA covers Firefox,
  # Safari, Edge, and the responsive-viewport matrix).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # `--with-deps` adds the Linux system packages Chromium needs
        # (libnss3, libatk-bridge2.0, etc). Firefox / WebKit are
        # intentionally NOT installed — Phase 8 stays Chromium-only.
        run: npx playwright install --with-deps chromium

      - name: Generate the Phase 8 test fixture
        # The full-flow smoke test needs the minimal PNG with the
        # Author tEXt chunk. The script is idempotent (writes the
        # same bytes every run).
        run: node scripts/generate-test-fixture.mjs

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
